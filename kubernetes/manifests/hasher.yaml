---
apiVersion: v1
kind: Service
metadata:
  name: hasher
  labels:
    app: hasher
    stack: kubercoins
spec:
  type: ClusterIP
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: hasher
    stack: kubercoins
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hasher
  labels:
    app: hasher
    stack: kubercoins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hasher
      stack: kubercoins
  template:
    metadata:
      labels:
        app: hasher
        stack: kubercoins
    spec:
      containers:
      - image: tinkou/hasher:v2
        name: hasher
        ports:
        - containerPort: 8080
