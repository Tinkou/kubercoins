apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    stack: kubercoins
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      stack: kubercoins
      app: worker
  template:
    metadata:
      labels:
        stack: kubercoins
        app: worker
    spec:
      containers:
      - name: worker
        image: tinkou/worker:v0.1
