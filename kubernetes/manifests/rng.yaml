apiVersion: apps/v1
kind: Deployment
metadata:
  name: rng
  labels:
    stack: kubercoins
    app: rng
spec:
  replicas: 1
  selector:
    matchLabels:
      stack: kubercoins
      app: rng
  template:
    metadata:
      labels:
        stack: kubercoins
        app: rng
    spec:
      containers:
      - name: rng
        image: tinkou/rng:v0.1
---
apiVersion: v1
kind: Service
metadata:
  name: rng
  labels:
    stack: kubercoins
    app: rng
spec:
  type: ClusterIP
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: rng
