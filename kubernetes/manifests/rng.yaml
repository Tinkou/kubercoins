---
apiVersion: v1
kind: Service
metadata:
  name: rng
  labels:
    app: rng
    stack: kubercoins
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: rng
    stack: kubercoins
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rng
  labels:
    app: rng
    stack: kubercoins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rng
      stack: kubercoins
  template:
    metadata:
      labels:
        app: rng
        stack: kubercoins
    spec:
      containers:
      - image: tinkou/rng:v2
        name: rng
        ports:
        - containerPort: 80
