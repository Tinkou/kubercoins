---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: redis
    stack: kubercoins
  name: redis
spec:
  ports:
  - port: 6379
    protocol: TCP
    targetPort: 6379
  selector:
    app: redis
    stack: kubercoins
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app: redis
    stack: kubercoins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      stack: kubercoins
  serviceName: redis
  template:
    metadata:
      labels:
        app: redis
        stack: kubercoins
    spec:
      containers:
      - image: redis
        name: redis
        ports:
        - containerPort: 6379
        volumeMounts:
        - mountPath: /data
          name: redis-data
      volumes:
      - emptyDir: {}
        name: redis-data
