apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    stack: kubercoins
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      stack: kubercoins
      app: redis
  template:
    metadata:
      labels:
        stack: kubercoins
        app: redis
    spec:
      containers:
      - name: redis
        image: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    stack: kubercoins
    app: redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    protocol: TCP
    targetPort: 6379
  selector:
    app: redis
