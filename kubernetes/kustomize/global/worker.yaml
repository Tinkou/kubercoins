apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: tinkou/worker:v3
        env:
        - name: RNG_SERVICE_NAME
          valueFrom:
            secretKeyRef:
              name: worker
              key: rng-service-name
