apiVersion: apps/v1
kind: Deployment
metadata:
  name: rng
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  stack: kubercoins
                  app: rng
              topologyKey: kubernetes.io/hostname
      containers:
      - name: rng
        image: tinkou/rng:v1
        resources:
          requests:
            cpu: "50m"
            memory: "25Mi"
          limits:
            cpu: "100m"
            memory: "50Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
