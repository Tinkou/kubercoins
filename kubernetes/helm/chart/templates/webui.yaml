apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  labels:
    {{- with .Values.stackLabel }}
    stack: {{ . }}
    {{- end }}
    app: webui
spec:
  replicas: {{ .Values.webui.replicas }}
  selector:
    matchLabels:
      {{- with .Values.stackLabel }}
      stack: {{ . }}
      {{- end }}
      app: webui
  template:
    metadata:
      labels:
        {{- with .Values.stackLabel }}
        stack: {{ . }}
        {{- end }}
        app: webui
    spec:
      containers:
      - name: webui
        image: tinkou/webui:{{ .Values.webui.revision }}
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  labels:
    {{- with .Values.stackLabel }}
    stack: {{ . }}
    {{- end }}
    app: webui
spec:
  type: NodePort
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    {{- with .Values.stackLabel }}
    stack: {{ . }}
    {{- end }}
    app: webui
