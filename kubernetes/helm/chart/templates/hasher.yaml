apiVersion: apps/v1
kind: Deployment
metadata:
  name: hasher
  labels:
    {{- with .Values.stackLabel }}
    stack: {{ . }}
    {{- end }}
    app: hasher
spec:
  replicas: {{ .Values.hasher.replicas }}
  selector:
    matchLabels:
      {{- with .Values.stackLabel }}
      stack: {{ . }}
      {{- end }}
      app: hasher
  template:
    metadata:
      labels:
        {{- with .Values.stackLabel }}
        stack: {{ . }}
        {{- end }}
        app: hasher
    spec:
      containers:
      - name: hasher
        image: tinkou/hasher:{{ .Values.hasher.revision }}
---
apiVersion: v1
kind: Service
metadata:
  name: hasher
  labels:
    {{- with .Values.stackLabel }}
    stack: {{ . }}
    {{- end }}
    app: hasher
spec:
  type: ClusterIP
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    {{- with .Values.stackLabel }}
    stack: {{ . }}
    {{- end }}
    app: hasher
