apiVersion: apps/v1
kind: Deployment
metadata:
  name: rng
  labels:
    {{- with .Values.stackLabel }}
    stack: {{ . }}
    {{- end }}
    app: rng
spec:
  replicas: {{ .Values.rng.replicas }}
  selector:
    matchLabels:
      {{- with .Values.stackLabel }}
      stack: {{ . }}
      {{- end }}
      app: rng
  template:
    metadata:
      labels:
        {{- with .Values.stackLabel }}
        stack: {{ . }}
        {{- end }}
        app: rng
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  {{- with .Values.stackLabel }}
                  stack: {{ . }}
                  {{- end }}
                  app: rng
              topologyKey: kubernetes.io/hostname
      containers:
      - name: rng
        image: tinkou/rng:{{ .Values.rng.revision }}
        resources:
          requests:
            cpu: "50m"
            memory: "25Mi"
          limits:
            cpu: "100m"
            memory: "50Mi"
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 4
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rng
  labels:
    {{- with .Values.stackLabel }}
    stack: {{ . }}
    {{- end }}
    app: rng
spec:
  type: ClusterIP
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    {{- with .Values.stackLabel }}
    stack: {{ . }}
    {{- end }}
    app: rng
