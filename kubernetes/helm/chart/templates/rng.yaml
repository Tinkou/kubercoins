apiVersion: apps/v1
kind: Deployment
metadata:
  name: rng
  labels:
    {{- with .Values.stackLabel }}
    stack: {{ . }}
    {{- end }}
    app: rng
spec:
  replicas: {{ .Values.rng.replicas }}
  selector:
    matchLabels:
      {{- with .Values.stackLabel }}
      stack: {{ . }}
      {{- end }}
      app: rng
  template:
    metadata:
      labels:
        {{- with .Values.stackLabel }}
        stack: {{ . }}
        {{- end }}
        app: rng
    spec:
      containers:
      - name: rng
        image: dockercoins/rng:{{ .Values.rng.revision }}
---
apiVersion: v1
kind: Service
metadata:
  name: rng
  labels:
    {{- with .Values.stackLabel }}
    stack: {{ . }}
    {{- end }}
    app: rng
spec:
  type: ClusterIP
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    {{- with .Values.stackLabel }}
    stack: {{ . }}
    {{- end }}
    app: rng
