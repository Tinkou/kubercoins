apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: kubercoins

build:
  artifacts:
    - image: tinkou/hasher
      context: ./hasher
    - image: tinkou/rng
      context: ./rng
    - image: tinkou/webui
      context: ./webui
    - image: tinkou/worker
      context: ./worker
  local:
    push: false
    useBuildkit: true

manifests:
  kustomize:
    paths:
      - ./kubernetes/kustomize/local

portForward:
  - resourceType: Service
    resourceName: webui
    port: 80
    localPort: 9000

profiles:
  - name: helm
    deploy:
      helm:
        releases:
          - name: kubercoins
            chartPath: kubernetes/helm/chart
            createNamespace: true
            valuesFiles:
              - kubernetes/helm/values/local.yaml

